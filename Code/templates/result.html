<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fourline Travels | Invoice ready</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="shell">
      <div class="brand"><span class="brand-mark">F</span> Fourline Travels</div>
      <section class="panel">
        <div class="success-mark" aria-hidden="true">&#10003;</div>
        <p class="eyebrow">Processing complete</p>
        <h1>Your invoice is ready.</h1>
        <p class="intro">The calculated invoice has been saved as <strong>{{ filename }}</strong>.</p>
        <a class="button" href="{{ url_for('download', filename=filename) }}">Download invoice <span aria-hidden="true">&darr;</span></a>
        <p class="secondary-link"><a href="{{ url_for('index') }}">Process another file</a></p>
      </section>
    </main>
  </body>
</html>
